name: Rain Alert

on:
  # 主役: cron-job.org から5分ごとに合図が届く
  workflow_dispatch: {}
  # 保険: GitHub自身の定期実行も残す(実測では平均2〜3時間に1回しか動かないが、
  # 合図が止まったときに完全に止まるよりは良い)
  schedule:
    - cron: "*/5 * * * *"

# 通知のクールダウン状態(rain_alert_state.json)をリポジトリにコミットし直すために書き込み権限が必要
permissions:
  contents: write

# 同時に2つ動かさない(通知履歴の読み書きが食い違って二重通知になるのを防ぐ)
concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: 降水チェック実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
        run: python3 rain_alert.py

      - name: クールダウン状態をコミット
        run: |
          git config user.name "rain-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rain_alert_state.json
          # 変更が無ければ何もしない(diffが無いとcommitはエラーになるため)
          git diff --cached --quiet && exit 0
          git commit -m "update rain alert state"
          # 朝のグラフ側も同じブランチに保存するので、先に最新を取り込んでから送る
          git pull --rebase
          git push
