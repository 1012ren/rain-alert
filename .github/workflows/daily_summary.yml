name: Daily Rain Summary

on:
  schedule:
    # 6:00 JST = 21:00 UTC(前日)。JSTはUTC+9のため。
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 日本語フォントのインストール
        # グラフのタイトル・軸ラベルを日本語で表示するため(Ubuntuランナーには標準で無い)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: グラフ作成とLINE送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python3 daily_summary.py
